<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synapse Remote — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04060c}
a{color:#7cc8ff}a:hover{color:#b8e2ff}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 360px; height: 800px; box-sizing: border-box; background: radial-gradient(120% 60% at 50% 18%, #0d1a3a 0%, #070b18 55%, #04060c 100%); color: #e6ecff; font-family: Manrope, sans-serif; display: flex; flex-direction: column; padding: 18px 18px 20px; gap: 14px; position: relative; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center; font-family: Rajdhani, sans-serif; letter-spacing: 1.5px; font-size: 13px; color: #8fa3d6">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3ef0c4; box-shadow: 0 0 8px #3ef0c4"></span>SYNAPSE · HOME</div>
<div>8:52 AM</div>
</div>

<div style="display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 22px; background: linear-gradient(160deg, rgba(58,180,255,0.10), rgba(139,92,246,0.10)); border: 1px solid rgba(124,200,255,0.25)">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #5fd0ff 0%, #2a6bff 35%, rgba(42,107,255,0) 70%); box-shadow: 0 0 28px rgba(58,180,255,0.55)">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#dff4ff" stroke-width="1.6" stroke-linecap="round"><circle cx="20" cy="20" r="3.2" fill="#ffffff"></circle><path d="M20 17V6m0 0h-4m4 0h4M20 23v11m0 0h-4m4 0h4M17 20H6m0 0v-4m0 4v4M23 20h11m0 0v-4m0 4v4"></path><circle cx="16" cy="6" r="1.4"></circle><circle cx="24" cy="34" r="1.4"></circle><circle cx="6" cy="24" r="1.4"></circle><circle cx="34" cy="16" r="1.4"></circle></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: Rajdhani, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.5px">Good morning, Mason</div>
<div style="font-size: 13px; color: #a9b8e3">Home occupied · 78°F inside · 70° out</div>
</div>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-family: Rajdhani, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #8fa3d6">ROOM CHANNELS</div>
<a href="Room.dc.html" style="font-size: 13px; text-decoration: none">Open ›</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<a href="Room.dc.html" style="text-decoration: none; color: #e6ecff; border-radius: 16px; padding: 12px 10px; background: rgba(58,180,255,0.14); border: 1px solid rgba(58,180,255,0.6); box-shadow: 0 0 16px rgba(58,180,255,0.25); display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Rajdhani, sans-serif; font-size: 12px; color: #7cc8ff; letter-spacing: 1px">CH 1</span><span style="font-weight: 700; font-size: 14px">Living</span><span style="font-size: 11px; color: #a9b8e3">4 on · TV</span></a>
<a href="Room.dc.html" style="text-decoration: none; color: #e6ecff; border-radius: 16px; padding: 12px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(143,163,214,0.22); display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Rajdhani, sans-serif; font-size: 12px; color: #8fa3d6; letter-spacing: 1px">CH 2</span><span style="font-weight: 700; font-size: 14px">Kitchen</span><span style="font-size: 11px; color: #a9b8e3">all off</span></a>
<a href="Room.dc.html" style="text-decoration: none; color: #e6ecff; border-radius: 16px; padding: 12px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(143,163,214,0.22); display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Rajdhani, sans-serif; font-size: 12px; color: #8fa3d6; letter-spacing: 1px">CH 3</span><span style="font-weight: 700; font-size: 14px">Bedroom</span><span style="font-size: 11px; color: #a9b8e3">[ROOM]</span></a>
</div>

<div style="font-family: Rajdhani, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #8fa3d6">SCENES</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{scenes}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">
<span style="{{s.dot}}"></span>
<span style="font-family: Rajdhani, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.5px">{{s.label}}</span>
</button>
</sc-for>
</div>

<div style="flex-grow: 1"></div>

<div style="position: relative; height: 150px; border-radius: 36px; background: linear-gradient(180deg, rgba(20,30,62,0.9), rgba(10,14,30,0.95)); border: 1px solid rgba(124,200,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 -10px 40px rgba(42,107,255,0.12); display: flex; align-items: center; justify-content: space-around; padding: 0 14px">
<button aria-label="Home" style="width: 64px; height: 64px; border-radius: 20px; border: 1px solid rgba(143,163,214,0.35); background: rgba(255,255,255,0.05); color: #cfe0ff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 10px; letter-spacing: 1px">HOME</span>
</button>
<button onClick="{{toggleMic}}" aria-label="Talk to Jarvis" style="{{micStyle}}">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
<button onClick="{{allOff}}" aria-label="All off" style="width: 64px; height: 64px; border-radius: 20px; border: 1px solid rgba(255,107,129,0.55); background: rgba(255,107,129,0.10); color: #ff8fa1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v8"></path><path d="M6.4 6.6a8 8 0 1 0 11.2 0"></path></svg>
<span style="font-size: 10px; letter-spacing: 1px">ALL OFF</span>
</button>
</div>
<div style="text-align: center; font-size: 12px; color: #8fa3d6; margin-top: -6px">{{micHint}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3ab4ff","options":["#3ab4ff","#8b5cf6","#3ef0c4"]},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'Home', on: { Morning: true, Evening: false, Focus: false, Movie: false }, mic: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#3ab4ff';
    const modes = ['Home', 'Away', 'Night', 'Guest'].map((label) => {
      const sel = this.state.mode === label;
      return { label, pick: () => this.setState({ mode: label }),
        style: 'height: 36px; padding: 0 16px; border-radius: 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; ' +
          (sel ? 'background: ' + accent + '; color: #04101f; border: 1px solid ' + accent + '; box-shadow: 0 0 14px ' + accent + '88;'
               : 'background: rgba(255,255,255,0.04); color: #c3d0f2; border: 1px solid rgba(143,163,214,0.28);') };
    });
    const tint = { Morning: '#ffc857', Evening: '#ff8a5c', Focus: '#5fd0ff', Movie: '#a78bfa' };
    const scenes = Object.keys(tint).map((label) => {
      const on = !!this.state.on[label]; const c = tint[label];
      return { label, on: on ? 'true' : 'false',
        pick: () => this.setState({ on: { ...this.state.on, [label]: !on } }),
        dot: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (on ? c : 'transparent') + '; border: 2px solid ' + c + '; box-shadow: ' + (on ? '0 0 10px ' + c : 'none'),
        style: 'height: 76px; border-radius: 20px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px 16px; text-align: left; color: #eef3ff; ' +
          (on ? 'background: linear-gradient(150deg, ' + c + '33, rgba(255,255,255,0.03)); border: 1px solid ' + c + 'aa; box-shadow: 0 0 18px ' + c + '40;'
              : 'background: rgba(255,255,255,0.035); border: 1px solid rgba(143,163,214,0.2);') };
    });
    const mic = this.state.mic;
    return { modes, scenes,
      toggleMic: () => this.setState({ mic: !mic }),
      allOff: () => this.setState({ on: { Morning: false, Evening: false, Focus: false, Movie: false } }),
      micHint: mic ? 'Listening… “Turn on the living room lights”' : 'Hold to talk to Jarvis',
      micStyle: 'width: 96px; height: 96px; border-radius: 50%; border: 2px solid ' + (mic ? '#ffffff' : accent) + '; display: flex; align-items: center; justify-content: center; ' +
        'background: radial-gradient(circle at 50% 40%, ' + accent + ' 0%, #2a3cff 55%, #3b1a7a 100%); ' +
        'box-shadow: 0 0 ' + (mic ? '46px' : '26px') + ' ' + accent + (mic ? 'cc' : '88') + ', inset 0 2px 6px rgba(255,255,255,0.35)' };
  }
}
</script>
</body>
</html>
