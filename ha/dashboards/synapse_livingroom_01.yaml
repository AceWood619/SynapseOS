# Synapse wall panel — Living Room (livingroom-01)
# Generated by tools/provision/dashboard.py. Node sensors are live.
# TODO: point scene.evening/movie/good_night and light.living_room at your real entities.
title: Living Room
views:
- title: Panel
  path: panel
  type: panel
  badges: []
  cards:
  - type: vertical-stack
    cards:
    - type: markdown
      content: "{% set occ = is_state('binary_sensor.synapse_livingroom_01_occupancy','on') %}{% set g\
        \ = ['Good night','Good morning','Good afternoon','Good evening'][now().hour // 6] %}# {{ g }}\n\
        ### Living Room \u2014 {{ 'Occupied' if occ else 'Empty' }}"
    - type: weather-forecast
      entity: weather.home
      show_forecast: false
    - type: horizontal-stack
      cards:
      - type: button
        name: Evening
        icon: mdi:weather-sunset
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.evening
      - type: button
        name: Movie
        icon: mdi:movie-open
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.movie
      - type: button
        name: Good night
        icon: mdi:power-sleep
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.good_night
    - type: light
      entity: light.living_room
    - type: glance
      title: Living Room conditions
      columns: 3
      state_color: true
      entities:
      - entity: sensor.synapse_livingroom_01_illuminance
        name: Light
      - entity: sensor.synapse_livingroom_01_pressure
        name: Pressure
      - entity: sensor.synapse_livingroom_01_wifi_rssi
        name: Wi-Fi
      - entity: binary_sensor.synapse_livingroom_01_occupancy
        name: Presence
      - entity: sensor.synapse_livingroom_01_ble_known
        name: Nearby
      - entity: sensor.synapse_livingroom_01_screen
        name: Panel
    - type: entities
      title: Node health
      entities:
      - entity: binary_sensor.synapse_livingroom_01_online
        name: Online
      - entity: sensor.synapse_livingroom_01_battery
        name: Battery
      - entity: binary_sensor.synapse_livingroom_01_charging
        name: Charging
      - entity: sensor.synapse_livingroom_01_battery_temp
        name: Battery temp
      - entity: sensor.synapse_livingroom_01_mem_free
        name: Free memory
      - entity: sensor.synapse_livingroom_01_status
        name: Status

