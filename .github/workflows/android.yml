name: synapse-core

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synapse-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :core-logic:test :app:assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80 || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/core-logic/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: synapse-core-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # The phone-side chat (HANDS) pulls APKs with plain git, so publish into builds/ on main.
      - name: Publish APK to builds/
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          ver="0.1.${{ github.run_number }}"
          mkdir -p builds
          cp android/app/build/outputs/apk/release/app-release.apk builds/synapse-core-latest.apk
          sha=$(sha256sum builds/synapse-core-latest.apk | cut -d' ' -f1)
          printf '{"app":"synapse-core","version":"%s","sha256":"%s","commit":"%s","built":"%s"}\n' \
            "$ver" "$sha" "${{ github.sha }}" "$(date -u +%FT%TZ)" > builds/synapse-core-latest.json
          git config user.name "synapse-ci"
          git config user.email "synapse-ci@users.noreply.github.com"
          git add builds/
          git commit -m "CI: synapse-core $ver [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done
